name: build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Use the standard checkout action to pull down repo
      - name: Checkout
        uses: actions/checkout@v7

      # Use the Node version from .node-version, with npm caching
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: server/package-lock.json

      # Only the server is installed and checked here; the phone apps are built in Xcode / Android Studio.
      - name: Install
        run: npm ci
        working-directory: server

      # Two pretend players must be able to join and throw (see server/scripts/check-relay.mjs)
      - name: Check server
        run: npm run check
        working-directory: server
