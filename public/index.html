<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Portals</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14161c; color: #e9ecef;
    font: 14px/1.3 system-ui, -apple-system, sans-serif; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); pointer-events: none; }
  #hud > * { pointer-events: auto; }
  #status { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .85; }
  #dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: #555; }
  button { font: inherit; color: inherit; background: #2b2f3a; border: 1px solid #3d4250; border-radius: 10px;
    padding: 8px 12px; min-height: 40px; }
  button:active { background: #3d4250; }
  button.on { background: #e9ecef; color: #14161c; border-color: #e9ecef; }
  #panel { position: fixed; left: 10px; right: 10px; bottom: calc(64px + env(safe-area-inset-bottom));
    max-width: 420px; margin: 0 auto; background: #1f222bf2; border: 1px solid #3d4250; border-radius: 14px;
    padding: 14px; display: none; }
  #panel.open { display: block; }
  #panel h3 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; }
  #panel .row { display: flex; gap: 8px; margin-bottom: 12px; }
  #panel .row button { flex: 1; }
  #panel label { display: flex; justify-content: space-between; margin-top: 8px; }
  #panel input[type=range] { width: 100%; }
  #panel p { margin: 0 0 12px; opacity: .7; font-size: 12px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <h3>Edge mapping (whole room)</h3>
  <div class="row">
    <button id="mNeighbors">Neighbors</button>
    <button id="mPortals">Portals</button>
  </div>
  <p id="modeHelp"></p>
  <h3>Feel (this device)</h3>
  <label>Fling speed needed <span id="flingV"></span></label>
  <input id="fling" type="range" min="50" max="1500" step="50">
  <label>Friction <span id="fricV"></span></label>
  <input id="fric" type="range" min="0" max="5" step="0.1">
  <div class="row" style="margin:12px 0 0">
    <button id="clear">Clear my items</button>
  </div>
</div>

<div id="hud">
  <div id="status"><span id="dot"></span><span id="statusText">Connecting…</span></div>
  <button id="add">+ Item</button>
  <button id="gear">Settings</button>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- state ----------
const cfg = { fling: 350, fric: 1.6 };           // px/s outward speed needed to cross an edge; friction (1/s)
const R = 34;                                    // item radius, CSS px
const EMOJI = ['⭐', '🎈', '🔥', '💎', '🍀', '🌙', '⚡', '🎲', '🧩', '🪐'];
let W = 0, H = 0;
let me = null, players = [], mode = 'neighbors', roomName = 'main';
let ws = null, pingMs = null, pings = [];      // pings: last 30 round trips, ms
let items = [];                                  // { id, emoji, x, y, vx, vy, state: 'in'|'entering'|'leaving', age, held }
let flashes = [];                                // arrival/departure glows { x, y, color, age }
let seeded = false;

// ---------- canvas ----------
const cv = $('c'), ctx = cv.getContext('2d');
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const it of items) if (it.state === 'in') { it.x = clamp(it.x, R, W - R); it.y = clamp(it.y, R, H - R); }
}
window.addEventListener('resize', resize);
resize();

// ---------- who is where ----------
// Ring order = join order. `others()` lists everyone else starting with the player after me.
function others() {
  const i = players.findIndex((p) => p.id === me);
  return i < 0 ? [] : players.slice(i + 1).concat(players.slice(0, i));
}
const mySelf = () => players.find((p) => p.id === me);

// Portals mode treats left edge (bottom→top), top edge (left→right), right edge (top→bottom)
// as one strip of length 2H+W, split evenly between the other players.
// Previous player in the ring ends up on my left, next player on my right.
function segs() {
  const o = others().reverse(), L = 2 * H + W;
  return o.map((p, i) => ({ p, t0: (i * L) / o.length, t1: ((i + 1) * L) / o.length }));
}
function tOf(edge, x, y) {
  x = clamp(x, 0, W); y = clamp(y, 0, H);
  return edge === 'L' ? H - y : edge === 'T' ? H + x : H + W + y;
}
function ptAt(t) { // point on the strip, its direction of travel (tx,ty) and outward normal (nx,ny)
  if (t < H) return { x: 0, y: H - t, tx: 0, ty: -1, nx: -1, ny: 0 };
  if (t < H + W) return { x: t - H, y: 0, tx: 1, ty: 0, nx: 0, ny: -1 };
  return { x: W, y: t - H - W, tx: 0, ty: 1, nx: 1, ny: 0 };
}
function targetFor(edge, x, y) {
  const o = others();
  if (!o.length || edge === 'B') return null;
  if (mode === 'neighbors') {
    if (edge === 'R') return o[0];
    if (edge === 'L') return o[o.length - 1];
    return null;
  }
  const t = tOf(edge, x, y);
  const s = segs().find((s) => t >= s.t0 && t <= s.t1);
  return s ? s.p : null;
}

// ---------- items ----------
function newItem(x, y) {
  return {
    id: `${me}-${Date.now().toString(36)}-${Math.floor(Math.random() * 1e6).toString(36)}`,
    emoji: EMOJI[Math.floor(Math.random() * EMOJI.length)],
    x, y, vx: 0, vy: 0, state: 'in', age: 0, held: false,
  };
}
function spawn() {
  items.push(newItem(W * (0.25 + Math.random() * 0.5), H * (0.3 + Math.random() * 0.4)));
}

// Called when an item hits an edge moving outward. Returns true if it was handed to another player.
function tryThrow(it, edge) {
  const out = edge === 'L' ? -it.vx : edge === 'R' ? it.vx : edge === 'T' ? -it.vy : it.vy;
  if (out < cfg.fling || !ws || ws.readyState !== 1) return false;
  const p = targetFor(edge, it.x, it.y);
  if (!p) return false;
  const msg = { t: 'throw', to: p.id, mode, item: { id: it.id, emoji: it.emoji } };
  if (mode === 'neighbors') {
    // Phones side by side: keep height and velocity, so it reads as one continuous surface.
    msg.edge = edge; msg.u = it.y / H; msg.vx = it.vx; msg.vy = it.vy;
  } else {
    // Send position within my portal and speed split into "out through the edge" and "along the edge".
    const s = segs().find((s) => s.p.id === p.id);
    const t = tOf(edge, it.x, it.y), q = ptAt(t);
    msg.f = (t - s.t0) / (s.t1 - s.t0); msg.n = out; msg.s = it.vx * q.tx + it.vy * q.ty;
  }
  ws.send(JSON.stringify(msg));
  // The item keeps sliding off-screen locally; that animation covers the network delay.
  it.state = 'leaving'; it.age = 0;
  flashes.push({ x: it.x, y: it.y, color: p.color, age: 0 });
  blip(520, 880);
  return true;
}

function onThrow(m) {
  const it = { id: m.item.id, emoji: m.item.emoji, state: 'entering', age: 0, held: false };
  const from = players.find((p) => p.id === m.from);
  const s = m.mode === 'portals' ? segs().find((s) => s.p.id === m.from) : null;
  if (m.mode === 'neighbors') {
    it.x = m.edge === 'R' ? -R : W + R;          // left their right edge → arrives on my left edge
    it.y = clamp(m.u * H, R, H - R);
    it.vx = m.vx; it.vy = m.vy;
  } else if (s) {
    // Mirror along the edge, as if we were facing each other across the portal.
    const q = ptAt(s.t1 - m.f * (s.t1 - s.t0));
    it.x = q.x + q.nx * R; it.y = q.y + q.ny * R;
    it.vx = -q.nx * m.n - q.tx * m.s; it.vy = -q.ny * m.n - q.ty * m.s;
  } else {
    it.x = W / 2; it.y = H / 2; it.vx = 0; it.vy = 0; it.state = 'in';
  }
  items.push(it);
  flashes.push({ x: clamp(it.x, 0, W), y: clamp(it.y, 0, H), color: from ? from.color : '#fff', age: 0 });
  blip(880, 440);
  if (navigator.vibrate) navigator.vibrate(20);
}

// ---------- physics ----------
function step(dt) {
  const decay = Math.exp(-cfg.fric * dt);
  for (const it of items) {
    it.age += dt;
    if (it.held) continue;
    it.x += it.vx * dt; it.y += it.vy * dt;
    it.vx *= decay; it.vy *= decay;

    if (it.state === 'leaving') continue;
    if (it.state === 'entering') {
      const inside = it.x >= R && it.x <= W - R && it.y >= R && it.y <= H - R;
      if (inside) it.state = 'in';
      else if (it.age > 1) { it.x = clamp(it.x, R, W - R); it.y = clamp(it.y, R, H - R); it.state = 'in'; }
    }
    // Walls only matter when moving outward. An 'entering' item bounces but can't be re-thrown yet.
    const canThrow = it.state === 'in';
    if (it.x < R && it.vx < 0 && !(canThrow && tryThrow(it, 'L'))) { it.x = R; it.vx *= -0.6; }
    else if (it.x > W - R && it.vx > 0 && !(canThrow && tryThrow(it, 'R'))) { it.x = W - R; it.vx *= -0.6; }
    if (it.state === 'leaving') continue;
    if (it.y < R && it.vy < 0 && !(canThrow && tryThrow(it, 'T'))) { it.y = R; it.vy *= -0.6; }
    else if (it.y > H - R && it.vy > 0) { it.y = H - R; it.vy *= -0.6; }
  }

  // Item-vs-item bumps (equal mass). A cluttered screen makes clean flings harder.
  const solid = items.filter((it) => it.state === 'in');
  for (let i = 0; i < solid.length; i++) for (let j = i + 1; j < solid.length; j++) {
    const a = solid[i], b = solid[j];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
    if (d >= 2 * R || d === 0) continue;
    const nx = dx / d, ny = dy / d, push = (2 * R - d) / 2;
    if (!a.held) { a.x -= nx * push; a.y -= ny * push; }
    if (!b.held) { b.x += nx * push; b.y += ny * push; }
    const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (rel < 0) {
      if (!a.held) { a.vx += rel * nx; a.vy += rel * ny; }
      if (!b.held) { b.vx -= rel * nx; b.vy -= rel * ny; }
    }
  }

  items = items.filter((it) => !(it.state === 'leaving' &&
    (it.age > 1 || it.x < -2 * R || it.x > W + 2 * R || it.y < -2 * R || it.y > H + 2 * R)));
  for (const f of flashes) f.age += dt;
  flashes = flashes.filter((f) => f.age < 0.4);
}

// ---------- input ----------
const drags = new Map(); // pointerId -> { it, ox, oy, samples: [{x, y, t}] }
cv.addEventListener('pointerdown', (e) => {
  initAudio();
  $('panel').classList.remove('open');
  let hit = null;
  for (const it of items) {
    if (it.state !== 'in' || it.held) continue;
    if (Math.hypot(e.clientX - it.x, e.clientY - it.y) <= R * 1.35) hit = it;
  }
  if (!hit) return;
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  hit.held = true; hit.vx = hit.vy = 0;
  items.splice(items.indexOf(hit), 1); items.push(hit); // bring to front
  drags.set(e.pointerId, { it: hit, ox: hit.x - e.clientX, oy: hit.y - e.clientY,
    samples: [{ x: e.clientX, y: e.clientY, t: e.timeStamp }] });
});
cv.addEventListener('pointermove', (e) => {
  const d = drags.get(e.pointerId);
  if (!d) return;
  d.it.x = clamp(e.clientX + d.ox, R, W - R);
  d.it.y = clamp(e.clientY + d.oy, R, H - R);
  d.samples.push({ x: e.clientX, y: e.clientY, t: e.timeStamp });
  while (d.samples.length > 2 && e.timeStamp - d.samples[0].t > 90) d.samples.shift();
});
function release(e) {
  const d = drags.get(e.pointerId);
  if (!d) return;
  drags.delete(e.pointerId);
  d.it.held = false;
  // Release velocity = average finger velocity over the last ~90ms.
  const a = d.samples[0], b = d.samples[d.samples.length - 1], dt = (b.t - a.t) / 1000;
  if (dt > 0.005 && e.timeStamp - b.t < 80) {
    let vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt;
    const sp = Math.hypot(vx, vy), max = 4500;
    if (sp > max) { vx *= max / sp; vy *= max / sp; }
    d.it.vx = vx; d.it.vy = vy;
  }
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', (e) => e.preventDefault());

// ---------- sound ----------
let ac = null;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) ac = new AC();
}
function blip(f0, f1) {
  if (!ac || ac.state !== 'running') return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'sine';
  o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + 0.12);
  g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.16);
}

// ---------- drawing ----------
function edgeLabel(text, x, y, rot, color) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = color; ctx.font = '600 13px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, 0, 0); ctx.restore();
}
function strip(t0, t1, p) { // draw a coloured band along the edge strip from t0 to t1
  const T = 8, gap = 5;
  const cuts = [t0, H, H + W, t1].filter((t) => t >= t0 && t <= t1).sort((a, b) => a - b);
  ctx.fillStyle = p.color;
  for (let i = 0; i < cuts.length - 1; i++) {
    const a = cuts[i] + (i === 0 ? gap : 0), b = cuts[i + 1] - (i === cuts.length - 2 ? gap : 0);
    if (b - a < 1) continue;
    const pa = ptAt(a + 0.01), pb = ptAt(b - 0.01);
    const x = Math.min(pa.x, pb.x), y = Math.min(pa.y, pb.y);
    if (pa.nx !== 0) ctx.fillRect(pa.nx < 0 ? 0 : W - T, y, T, Math.abs(pb.y - pa.y));
    else ctx.fillRect(x, 0, Math.abs(pb.x - pa.x), T);
  }
  const m = ptAt((t0 + t1) / 2);
  edgeLabel(p.name, m.x - m.nx * 24, m.y - m.ny * 24, m.nx < 0 ? -Math.PI / 2 : m.nx > 0 ? Math.PI / 2 : 0, p.color);
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  const self = mySelf(), o = others();

  if (o.length) {
    if (mode === 'neighbors') {
      strip(0, H, o[o.length - 1]);
      strip(H + W, 2 * H + W, o[0]);
    } else {
      for (const s of segs()) strip(s.t0, s.t1, s.p);
    }
  } else {
    ctx.fillStyle = '#868e96'; ctx.font = '15px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Waiting for another device to join…', W / 2, H * 0.18);
    ctx.fillText(location.host, W / 2, H * 0.18 + 24);
  }
  if (self) { ctx.fillStyle = self.color; ctx.globalAlpha = 0.5; ctx.fillRect(0, H - 3, W, 3); ctx.globalAlpha = 1; }

  for (const f of flashes) {
    const k = f.age / 0.4;
    ctx.globalAlpha = 0.5 * (1 - k); ctx.fillStyle = f.color;
    ctx.beginPath(); ctx.arc(f.x, f.y, R * (1 + 2.5 * k), 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.font = `${R * 1.15}px system-ui, "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const it of items) {
    ctx.fillStyle = it.held ? '#3d4250' : '#2b2f3a';
    ctx.beginPath(); ctx.arc(it.x, it.y, it.held ? R * 1.08 : R, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillText(it.emoji, it.x, it.y + 2);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  step(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---------- network ----------
function connect() {
  roomName = new URLSearchParams(location.search).get('room') || 'main';
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/?room=${encodeURIComponent(roomName)}`);
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === 'hello') {
      me = m.id;
      if (!seeded) { seeded = true; for (let i = 0; i < 3; i++) spawn(); }
    } else if (m.t === 'room') { players = m.players; mode = m.mode; ui(); }
    else if (m.t === 'throw') onThrow(m);
    else if (m.t === 'bounce') { const it = newItem(W / 2, H / 2); it.id = m.item.id; it.emoji = m.item.emoji; items.push(it); }
    else if (m.t === 'pong') {
      pingMs = Math.round(performance.now() - m.ts);
      pings.push(pingMs); if (pings.length > 30) pings.shift();
      ui();
    }
    else if (m.t === 'full') { $('statusText').textContent = 'Room is full (8 players)'; }
  };
  ws.onclose = () => { players = []; pingMs = null; pings = []; ui(); setTimeout(connect, 1000); };
}
setInterval(() => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'ping', ts: performance.now() })); }, 1000);
document.addEventListener('visibilitychange', () => { last = performance.now(); });

// ---------- UI ----------
function ui() {
  const self = mySelf();
  $('dot').style.background = self ? self.color : '#555';
  $('statusText').textContent = self
    ? `${self.name} · ${players.length} in "${roomName}"${pingMs != null ? ` · ${pingMs}ms (worst ${Math.max(...pings)})` : ''}`
    : 'Connecting…';
  $('mNeighbors').classList.toggle('on', mode === 'neighbors');
  $('mPortals').classList.toggle('on', mode === 'portals');
  $('modeHelp').textContent = mode === 'neighbors'
    ? 'Phones in a row or circle. Left edge goes to the player on your left, right edge to the player on your right. Height and speed carry over.'
    : 'Every other player owns a coloured stretch of your left, top and right edges. Fling at their colour.';
  $('flingV').textContent = `${cfg.fling} px/s`;
  $('fricV').textContent = cfg.fric.toFixed(1);
}
$('fling').value = cfg.fling; $('fric').value = cfg.fric;
$('fling').oninput = (e) => { cfg.fling = Number(e.target.value); ui(); };
$('fric').oninput = (e) => { cfg.fric = Number(e.target.value); ui(); };
$('gear').onclick = () => $('panel').classList.toggle('open');
$('add').onclick = () => { initAudio(); if (me != null) spawn(); };
$('clear').onclick = () => { items = []; drags.clear(); };
const setMode = (m) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'mode', mode: m })); };
$('mNeighbors').onclick = () => setMode('neighbors');
$('mPortals').onclick = () => setMode('portals');
ui();
connect();
</script>
</body>
</html>
